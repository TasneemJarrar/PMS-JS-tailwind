<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/output.css">
</head>

<body class="bg-white text-black dark:bg-gray-900 dark:text-white font-body transition-all duration-300 ease-in-out">

  <div class="grid grid-cols-12 min-h-screen">

    <div class="col-span-4 md:col-span-2 min-w-0 sticky top-0 bottom-0 h-full">
      <header class="font-heading h-full bg-gray-800  text-white border-gray-700 ">
        <div class="h-full flex flex-col p-4 md:p-5"">
          <div class=" flex flex-col gap-2 ">
            <div class=" flex items-center justify-between gap-3 pb-5 border-b border-gray-700">
          <p class="text-lg font-bold leading-tight truncate">Product Managment</p>
          <button id="mode-toggle"
            class="w-8 h-8 rounded-xl hover:bg-gray-300/70 dark:hover:bg-gray-100/40 hover:scale-105  hover:shadow-2xl  dark:shadow-black/40 transition-all font-semibold text-xl">
            <i id="mode-icon" class="fa-regular fa-moon"></i>
          </button>
        </div>
    </div>
    <div class="mt-6">
      <p class="text-xs uppercase tracking-wider font-semibold">
        Current Time
      </p>
      <div id="clock" class="mt-1 text-2xl font-bold tracking-tight"></div>
    </div>
    <div class="mt-4 border-t border-gray-700">
      <a href="./index.html" class="flex gap-2 items-center w-full p-3 hover:bg-purple-400/10 hover:text-purple-400">
        <i class="fa-solid fa-box-archive"></i> Products
      </a>

      <a href="#" class="flex gap-2 items-center w-full p-3 bg-purple-400/10 text-purple-400">
        <i class="fa-solid fa-clipboard"></i> Notes
      </a>
    </div>

  </div>
  </header>
  </div>

  <div class="col-span-8 md:col-span-10 min-w-0">
    <header class="sticky top-0 z-20 backdrop-blur-md bg-white dark:bg-gray-900 border border-white/5">
      <div class="container mx-auto py-4 px-4 md:px-5 flex justify-between items-center">
        <div>
          <h1 class="font-display text-3xl md:text-4xl font-bold"> Notes </h1>
          <p class="text-sm font-semibold text-purple-500 dark:text-purple-400 mt-2"> Write down ideas, tasks, and anything worth remembering. </p>
        </div>

        <div class="flex items-center gap-3 font-mono text-sm text-gray-500">
          <span class="noteCount">0 saved</span>
          <span class="w-1 h-1 rounded-full bg-gray-500"></span>
          <button class="favNotes hover:text-lime-300 transition-all">Favorite Notes</button>
        </div>
      </div>
    </header>

    <div
      class="emptyNote container mx-auto px-4 md:px-5 min-h-screen flex justify-center items-center flex-col gap-4 hidden">
      <p class="font-display text-2xl text-gray-500">nothing here yet</p>
      <p class="text-sm text-gray-500">type below and click add to add your first note</p>
    </div>

    <main class="container mx-auto px-4 md:px-5 pb-32">
      <div class="notesContainer grid grid-cols-1  lg:grid-cols-2 gap-8 px-5 py-8">
      </div>
    </main>

    <footer
      class="fixed bottom-0 left-1/3 md:left-[16.666667%] right-0 z-30 py-4 px-4 md:px-5 bg-linear-to-t from-white via-white/95 to-transparent dark:from-gray-950 dark:via-gray-950/95 dark:to-transparent">
      <div class="container mx-auto px-4 md:px-5">
        <div class="flex items-center gap-2 mb-2 font-mono text-sm text-gray-500">
          <div class="colorPicker flex gap-2">
            <button data-color="violet"
              class="colorSwitch w-5 h-5 rounded-full bg-violet-400 ring-2 ring-offset-2 ring-offset-gray-950 ring-violet-400"></button>
            <button data-color="pink" class="colorSwitch w-5 h-5 rounded-full bg-pink-400"></button>
            <button data-color="lime" class="colorSwitch w-5 h-5 rounded-full bg-lime-300"></button>
            <button data-color="cyan" class="colorSwitch w-5 h-5 rounded-full bg-cyan-300"></button>
          </div>

          <form
            class="addNoteForm w-full flex items-end gap-2 bg-gray-100  dark:bg-gray-900 rounded-3xl px-4 py-3 shadow-2xl shadow-black/50 border border-white/5">
            <textarea id="noteInput" placeholder="Write something ..."
              class="flex items-center w-full bg-transparent resize-none max-h-32 placeholder:text-gray-500"></textarea>

            <button type="submit"
              class="CreateBtn shrink-0 font-display font-bold text-sm bg-transparent rounded-full text-gray-500 px-4 py-2 hover:bg-lime-300 transition-all active:scale-95">
              Add Note
            </button>
          </form>

        </div>
      </div>


    </footer>

  </div>



  </div>


  <script src="./assets/js/notes.js"></script>

</body>

</html>
