<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management System | Manage Products Easily</title>

  <meta name="description"
    content="A simple and efficient product management system for creating, managing, searching, and organizing products.">

  <meta property="og:title" content="Product Management System | Manage Products Easily">
  <meta property="og:description"
    content="Create, manage, search, and organize your products with a simple and intuitive product management system.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://your-domain.com/">
  <meta property="og:image" content="https://your-domain.com/assets/img/og-image.png">
  <meta property="og:site_name" content="Product Management System">
  <meta property="og:locale" content="en_US">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/output.css">
</head>

<body class="bg-white text-black dark:bg-gray-900 dark:text-white font-body transition-all duration-300 ease-in-out">

  <div class="grid grid-cols-12 min-h-screen">
    <div class="order-1  md:order-1 col-span-12 lg:col-span-2 min-w-0 lg:sticky lg:top-0 lg:h-screen">
      <header class="font-heading h-full bg-gray-800  text-white border-gray-700 ">
        <div class="h-full flex flex-row justify-between md:justify-start md:flex-col p-4 lg:p-5">
          <div class=" flex flex-col gap-2 ">
            <div class=" flex items-center justify-between gap-3 pb-5 md:border-b md:border-gray-700">
              <p class="text-lg font-bold leading-tight truncate">Product Managment</p>
              <button id="mode-toggle"
                class="w-8 h-8 rounded-xl hover:bg-gray-300/70 dark:hover:bg-gray-100/40 hover:scale-105  hover:shadow-2xl  dark:shadow-black/40 transition-all font-semibold text-xl">
                <i id="mode-icon" class="fa-regular fa-moon"></i>
              </button>
            </div>
          </div>
          <div class="mt:0 md:mt-6 hidden sm:inline">
            <p class="text-xs uppercase tracking-wider font-semibold">
              Current Time
            </p>
            <div id="clock" class="mt-1 text-2xl font-bold tracking-tight"></div>
          </div>
          <div class="md:mt-4 md:border-t md:border-gray-700 flex gap-2 md:flex-col md:gap-0">
            <a href="#" class="flex gap-2 items-center w-full p-3 bg-purple-400/5 text-purple-300 ">
              <i class="fa-solid fa-box-archive"></i> Products
            </a>

            <a href="./notes.html"
              class="flex gap-2 items-center w-full p-3 hover:bg-purple-400/10 hover:text-purple-400">
              <i class="fa-solid fa-clipboard"></i> Notes
            </a>
          </div>

        </div>
      </header>
    </div>

    <div class="order-3 md:order-2 col-span-12 lg:col-span-8 min-w-0">
      <section class="outputs font-data min-h-screen">
        <div class="w-full h-full px-4 py-5 md:px-6 md:py-6">
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">
            <div>
              <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Products</h1>
              <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Manage and track your products</p>
            </div>
            <div
              class="flex items-center gap-2 w-full lg:w-auto bg-white dark:bg-gray-800 p-1.5 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm">
              <div class="relative flex-1 lg:w-60">
                <input type="text" id="searchBar" onkeyup="searchData(this.value)"
                  class="w-full pl-4 pr-3 py-2.5 bg-transparent text-sm text-black dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 outline-none"
                  placeholder="Search products..." />
              </div>
              <select id="selectsearchMode"
                class="py-2.5 px-3 rounded-xl bg-gray-100 dark:bg-gray-700 text-sm text-gray-700 dark:text-gray-200 border-0 outline-none cursor-pointer focus:ring-2 focus:ring-purple-400">
                <option value="title" selected>Title</option>
                <option value="category">Category</option>
              </select>
              <button type="submit"
                class="w-10 h-10 shrink-0 flex items-center justify-center rounded-xl bg-purple-500 text-white hover:bg-purple-600 hover:scale-105 active:scale-95 transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                  <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"
                    d="M10.5 7a3.5 3.5 0 0 1 3.5 3.5m1.879 5.379l4.242 4.242M18 10.5a7.5 7.5 0 1 1-15 0a7.5 7.5 0 0 1 15 0Z" />
                </svg>
              </button>
            </div>
          </div>

          <div
            class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden">
            <div id="deleteAllbtn" class="px-4 py-4"></div>
            <div class="overflow-x-auto">
              <table class="w-full text-center table-auto">
                <thead class="bg-purple-50 dark:bg-purple-500/10 text-purple-700 dark:text-purple-300">
                  <tr>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Id</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Name</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Price</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Taxes</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Ads</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Discount</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Category</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Total</th>
                    <th class="px-4 py-4 text-xs uppercase tracking-wider font-bold">Actions</th>
                  </tr>
                </thead>
                <tbody id="productsTable" class="divide-y divide-gray-100 dark:divide-gray-700"></tbody>
              </table>
            </div>
          </div>

          <div class="searchFail hidden py-20 flex-col justify-center items-center gap-3 text-center">
            <div class="w-16 h-16 flex items-center justify-center rounded-2xl bg-gray-100 dark:bg-gray-800">
              <i class="fa-solid fa-magnifying-glass text-2xl text-gray-300 dark:text-gray-600"></i>
            </div>
            <p class="text-gray-600 dark:text-gray-300 font-semibold">No products found</p>
            <p class="text-sm text-gray-400 dark:text-gray-500">Try a different search term or category</p>
          </div>
        </div>
      </section>
    </div>


    <div class="order-2 md:order-3 col-span-12 lg:col-span-2 min-w-0 lg:sticky lg:top-0 lg:h-screen">
      <section class="inputs h-full font-data text-white bg-gray-800 ">
        <div class=" py-2 px-4 md:px-5">

          <div class="pb-5 mb-5 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-xl font-bold">Add Product</h2>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Enter product information below</p>
          </div>

          <form action="" class="flex flex-col gap-3 w-full items-start">
            <input type="text"
              class="w-full p-3 bg-gray-700 text-white placeholder:text-gray-500 rounded-xl border border-transparent outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all duration-200"
              id="title" placeholder="Product name" required />
            <input type="number" onkeyup="getTotal()"
              class="w-full p-3 bg-gray-700 text-white placeholder:text-gray-500 rounded-xl border border-transparent outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all duration-200"
              id="price" placeholder="price" required>
            <input type="number" onkeyup="getTotal()"
              class="w-full p-3 bg-gray-700 text-white placeholder:text-gray-500 rounded-xl border border-transparent outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all duration-200"
              id="taxes" placeholder="taxes" required>
            <input type="number" onkeyup="getTotal()"
              class="w-full p-3 bg-gray-700 text-white placeholder:text-gray-500 rounded-xl border border-transparent outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all duration-200"
              id="ads" placeholder="ads" required>
            <input type="number" onkeyup="getTotal()"
              class="w-full p-3 bg-gray-700 text-white placeholder:text-gray-500 rounded-xl border border-transparent outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all duration-200"
              id="discount" placeholder="discount" required>
            <p id="totalContainer"
              class="flex items-center justify-between px-4 py-3 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 font-semibold">
              <span>Total</span> <span class="hidden seperator">:</span> <span id="total"></span>
            </p>

            <input type="number"
              class="w-full p-3 bg-gray-700 text-white placeholder:text-gray-500 rounded-xl border border-transparent outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all duration-200"
              id="count" placeholder="quantity" required>
            <input type="text"
              class="w-full p-3 bg-gray-700 text-white placeholder:text-gray-500 rounded-xl border border-transparent outline-none focus:border-purple-400 focus:ring-2 focus:ring-purple-400/20 transition-all duration-200"
              id="category" placeholder="category" required>
            <button type="submit" id="createbtn"
              class="w-full mt-2 p-3 bg-purple-500 text-white font-semibold rounded-xl shadow-sm hover:bg-purple-600 hover:shadow-md hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
              Create Product </button>
          </form>

        </div>
      </section>
    </div>
  </div>

  <script src="./assets/js/main.js"></script>

</body>

</html>
