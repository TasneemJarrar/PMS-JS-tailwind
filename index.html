<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Manrope:wght@200..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/output.css">
</head>

<body class="bg-white text-black dark:bg-gray-900 dark:text-white font-body transition-all duration-300 ease-in-out">

  <div class="grid grid-cols-12 min-h-screen">

    <div class="col-span-2 min-w-0 sticky top-0 bottom-0 h-screen">
      <header class="font-heading h-full bg-white text-black dark:bg-gray-700 dark:text-white">
        <div class=" py-2 px-4 md:px-5">
          <div class="flex gap-2 items-center">
            <div class="flex justify-center items-center">
              <p class="text-xl font-bold">Product Managment System</p>
            </div>
            <button id="mode-toggle"
              class="w-9 h-9 rounded-xl hover:bg-gray-300/70 dark:hover:bg-gray-100/40 hover:scale-105  hover:shadow-2xl  dark:shadow-black/40 transition-all font-semibold text-xl">
              <i id="mode-icon" class="fa-regular fa-moon"></i>
            </button>
          </div>
          <div id="clock" class="text-2xl font-bold"></div>
        </div>
      </header>
    </div>

    <div class="col-span-8 min-w-0 ">
      <section class="outputs font-data h-full min-h-[650px]">
        <div class="w-full h-full py-2 px-4 md:px-5 overflow-x-auto ">
          <div class="searchBox  pt-5 font-data">
            <div class="flex  gap-3 justify-center align items-center">
              <input type="text" id="searchBar" onkeyup="searchData(this.value)"
                class=" p-3 bg-gray-200 dark:bg-gray-700  text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                placeholder="search by title..." />
              <select id="selectsearchMode"
                class="bg-transparent py-3 px-2 rounded-2xl dark:bg-gray-900 text-black dark:text-white outline-0 transition-colors duration-200 ease-in-out focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400">
                <option value="title" selected>title</option>
                <option value="category">category</option>
              </select>
              <button type="submit"
                class="p-3 text-black dark:text-white bg-transparent  hover:bg-purple-500 dark:hover:bg-purple-400 font-semibold rounded-2xl transition-colors duration-200 ease-in-out">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                  <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"
                    d="M10.5 7a3.5 3.5 0 0 1 3.5 3.5m1.879 5.379l4.242 4.242M18 10.5a7.5 7.5 0 1 1-15 0a7.5 7.5 0 0 1 15 0Z" />
                </svg>
              </button>
            </div>
          </div>

          <div class="py-8 flex flex-col gap-5">
            <div id="deleteAllbtn" class=""></div>
            <table class=" w-full text-center table-auto">
              <thead class="bg-purple-400/70 dark:bg-purple-400/50">
                <tr>
                  <th class="p-3">Id</th>
                  <th class="p-3">Name</th>
                  <th class="p-3">Price</th>
                  <th class="p-3">Taxes</th>
                  <th class="p-3">Ads</th>
                  <th class="p-3">Discount</th>
                  <th class="p-3">Category</th>
                  <th class="p-3">Total</th>
                  <th class="p-3">Actions</th>
                </tr>
              </thead>
              <tbody id="productsTable"></tbody>
            </table>
          </div>

          <div class="searchFail hidden py-16 flex-col justify-center items-center gap-3 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24"
              class="text-gray-300 dark:text-gray-600">
              <path fill="currentColor"
                d="M9.5 3A6.5 6.5 0 0 1 16 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5L18.5 21l-5-5v-.79l-.27-.27A6.52 6.52 0 0 1 9.5 16A6.5 6.5 0 0 1 3 9.5A6.5 6.5 0 0 1 9.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14S14 12 14 9.5S12 5 9.5 5" />
            </svg>
            <p class="text-gray-400 dark:text-gray-500 font-medium">
              No products found
            </p>
            <p class="text-sm text-gray-300 dark:text-gray-600">
              Try a different search term or category
            </p>
          </div>

        </div>
      </section>
    </div>

    <div class="col-span-2 min-w-0 sticky top-0 bottom-0 h-screen">
      <section class="inputs h-full font-data bg-white text-black dark:bg-gray-700 dark:text-white">
        <div class=" py-2 px-4 md:px-5">
          <div class="flex justify-center align items-center">

            <form action="" class="flex flex-col gap-3 w-full items-start">
              <input type="text"
                class=" p-3 bg-gray-200 dark:bg-gray-700 text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                id="title" placeholder="title" required>
              <input type="number" onkeyup="getTotal()"
                class="w-full p-3 bg-gray-200 dark:bg-gray-700 text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                id="price" placeholder="price" required>
              <input type="number" onkeyup="getTotal()"
                class="w-full p-3 bg-gray-200 dark:bg-gray-700 text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                id="taxes" placeholder="taxes" required>
              <input type="number" onkeyup="getTotal()"
                class="w-full p-3 bg-gray-200 dark:bg-gray-700 text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                id="ads" placeholder="ads" required>
              <input type="number" onkeyup="getTotal()"
                class="w-full p-3 bg-gray-300 dark:bg-gray-700 text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                id="discount" placeholder="discount" required>
              <p id="totalContainer" class="bg-rose-400/70 dark:bg-rose-500/40 rounded-2xl p-3">Total<span
                  class="hidden seperator">: </span><span id="total" class=""></span></p>

              <input type="number"
                class="w-full p-3 bg-gray-200 dark:bg-gray-700 text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                id="count" placeholder="quantity" required>
              <input type="text"
                class="w-full p-3 bg-gray-200 dark:bg-gray-700 text-black dark:text-white placeholder:text-gray-500 dark:placeholder:text-gray-400 rounded-2xl outline-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-400 transition-colors duration-200 ease-in-out"
                id="category" placeholder="category" required>
              <button type="submit" id="createbtn"
                class="w-full p-3 bg-purple-400 text-black dark:text-white dark:bg-purple-500 hover:bg-purple-500 dark:hover:bg-purple-400 font-semibold hover:tracking-wider rounded-2xl transition-colors duration-200 ease-in-out">
                Create Product</button>
            </form>

          </div>
        </div>
      </section>
    </div>
  </div>




  <script src="./assets/js/main.js"></script>

</body>

</html>
